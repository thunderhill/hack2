[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "perf-bot"
version = "0.1.0"
description = "Performance Bottleneck Explanation Bot — PS10"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "chromadb>=0.5.0",
    "plotly>=5.20.0",
    "mcp[cli]>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/perf_bot"]
