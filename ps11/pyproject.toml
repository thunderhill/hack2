[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "eda-report-generator"
version = "0.1.0"
description = "Automated EDA Report Generator — PS11"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "streamlit>=1.35.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "plotly>=5.20.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "scipy>=1.11.0",
    "chromadb>=0.5.0",
    "mcp[cli]>=1.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/eda_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
